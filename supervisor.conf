# Supervisor配置 - DouyinLiveRecorder
# 用于管理FastAPI应用进程

[program:douyin-live-recorder]
# 工作目录
directory=/Users/niko/DouyinLiveRecorder

# 启动命令
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

# 进程管理
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true

# 日志配置
stdout_logfile=/Users/niko/DouyinLiveRecorder/logs/supervisor_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/Users/niko/DouyinLiveRecorder/logs/supervisor_stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# 环境变量
environment=PYTHONUNBUFFERED="1",SUPERVISOR_ENABLED="true"

# 用户(根据实际情况调整)
user=niko

# 优先级
priority=999
